
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management System{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"
            defer></script>
</head>
<body>
    <header class="navbar">
        <a class="brand" href="{{ url_for('index') }}">
            Student Manager
        </a>

        <nav>
            <a href="{{ url_for('index') }}">Dashboard</a>
            <a href="{{ url_for('students') }}">Students</a>
            <a href="{{ url_for('add') }}">Add Student</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        Student Management System &copy; 2026
    </footer>
</body>
</html>
